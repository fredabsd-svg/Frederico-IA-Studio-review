[package]
name = "frederico-github-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GitHub: push, criacao de PR e matriz de autorizacao fail-closed (Fase 8, Etapa 5, ADR-0041)."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
frederico-core = { workspace = true }
# `push` fala o protocolo Git sobre HTTPS — é `git2`, a mesma
# biblioteca que o ADR-0047 escolheu por medição, e não
# `Command::new("git")` (ADR-0040 §D1).
git2 = "0.21"
# `create_pr` é REST; o `base_url` é injetável para o twin
# determinístico do ADR-0041 §D5 apontar para um servidor local.
reqwest = { workspace = true, features = ["json"] }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
