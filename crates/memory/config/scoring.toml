# scoring.toml — pesos numéricos do scoring do `frederico-memory`.
#
# ATENÇÃO: este arquivo é **mutável por PR normal** (não exige
# ADR novo). Mudanças devem ser justificadas pelo resultado
# do gold-set (`crates/memory/tests/fixtures/gold_set.jsonl`)
# no PR — `ADR-0011 §3`.
#
# Valores default pensados para a Etapa 1 (baseline lexical).
# A Etapa 2 (híbrido) ajusta pra que o sinal semântico tenha
# peso real (o `retriever` da Etapa 2 lê esses mesmos campos).
#
# Os pesos somam 1.0 (cada um é fração do score final). A
# soma não é enforçada — `lexical_weight + recency_weight +
# semantic_weight + importance_weight + confirmation_weight`
# pode estourar 1.0 se algum sinal ficar redundante com outro
# (ex.: lexical e semântica medindo a mesma coisa em queries
# curtas). Validação no `ScoringWeights::validate` rejeita
# pesos negativos, half-life ≤ 0, e max_k = 0.

[scoring]
# Sinais (5) — soma default = 1.0
lexical_weight = 0.40
recency_weight = 0.20
semantic_weight = 0.20
importance_weight = 0.10
confirmation_weight = 0.10

# Decay de recência: após 30 dias, fator cai a 0.5.
recency_half_life_days = 30.0

# Boost por confirmação do usuário.
user_pinned_boost = 1.5
user_confirmed_boost = 1.2

# Teto de memórias e orçamento de tokens.
max_k = 8
token_budget = 1500

# Regra de desempate por recência (PROMPT MESTRE §10.4).
# Se dois candidatos têm score dentro de recency_epsilon,
# o mais recente vence.
recency_epsilon = 0.01
