[package]
name = "frederico-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Camada de composicao do Frederico IA Studio: cataloga ferramentas, resolve jail por conversa e monta o ChatOrchestrator. Pura por construcao (passa no check-core-purity) para reuso da casca desktop e do modo servidor (PROMPT MESTRE 5.5). Ver ADR-0022."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
frederico-core = { workspace = true }
frederico-tool-registry = { workspace = true }
frederico-github-engine = { workspace = true }
frederico-provider-engine = { workspace = true }
frederico-model-catalog = { workspace = true }
frederico-storage = { workspace = true }
frederico-security = { workspace = true }
# Etapa 4 da Fase 7: runtimes portateis (Python + Node) consumidos
# pelas tools `exec.python` / `exec.node` (construidas via
# `tool_registry::exec::build_default_exec_tools`).
frederico-runtimes = { workspace = true }
frederico-execution-engine = { workspace = true }
frederico-memory = { workspace = true }
frederico-document-kits = { workspace = true }
frederico-process-architecture = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
secrecy = { workspace = true }
tempfile = "3"
