[package]
name = "frederico-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
# `deny` em vez de `forbid` para permitir `#![allow(unsafe_code)]`
# **apenas** no módulo `windows`, que é a única ponte com a Win32
# (DPAPI / Credential Manager). Qualquer outro `unsafe` que surja em
# outro lugar do crate quebra o build — exatamente o que queremos.
# Ver ADR-0007 §Implementação Windows.
unsafe_code = "deny"

[dependencies]
async-trait = { workspace = true }
# `bytes` para o body do response do reqwest (`response.bytes().await`
# retorna `Bytes`). Já é dep transitivo via `reqwest`, mas usar
# `bytes::Bytes` direto exige `bytes` como dep direta.
bytes = { workspace = true }
frederico-core = { workspace = true }
frederico-storage = { workspace = true }
# Etapa 6 da Fase 7 (ADR-0033 §D2): `reqwest` para o forward HTTP
# do proxy. O `network::dispatch_http` usa `reqwest::Client` pra
# repassar a request do filho pro upstream (com TLS configurado
# pelo app, sem sniff). O CONNECT tunnel é raw tokio (sem TLS, sem
# decode — bytes opacos, §"HTTPS via CONNECT" do ADR-0033).
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# Etapa 6 da Fase 7 (ADR-0033): `tracing` no `network::start_proxy`
# e no `dns_intercept::imp` (log de warn quando accept falha, info
# quando o DNS intercept é ativado pela primeira vez, etc.). Mesmo
# versão do `crates/provider-engine` e `crates/diagnostics` (evita
# features divergentes — `tracing-subscriber` exige a mesma
# versão em todo o dep graph).
tracing = { workspace = true }
# Etapa 2 da Fase 7 (ADR-0036): `SecurityJailResolver` usa
# `tokio::process::Command` (peça 4) e `tokio::process::Child` (para
# I/O async do stdout/stderr). Feature `process` é a única
# necessária — `rt`/`rt-multi-thread` ficam para o caller do
# resolver (a casca Tauri já tem tokio runtime configurado).
# Etapa 6: a `start_proxy` precisa também de `net` (TcpListener
# + TcpStream) e `io-util` (copy_bidirectional do CONNECT tunnel).
tokio = { workspace = true, features = ["net", "io-util", "process"] }

# Implementação Windows do CredentialStore (DPAPI / Windows Credential
# Manager) — gateada por target. É a **única** parte do núcleo que
# depende de plataforma, conforme ADR-0003 e ADR-0007.
[target.'cfg(windows)'.dependencies]
# Etapa 2 da Fase 7 (ADR-0036) adiciona Job Objects (kill tree)
# + Restricted Token (drop 6 privilégios elevados). As features
# `Win32_System_Threading` + `Win32_System_JobObjects` + `Win32_Security`
# entram aqui, **dentro do mesmo módulo `windows`** (a única ponte
# com Win32 no núcleo, ADR-0007). Ver scripts/check-core-purity.ps1
# para a allowlist de `windows` em `crates/security/src/windows*`.
#
# Etapa 5+ da Fase 7 (PR atual): path safety enforcement via raw
# `CreateProcessAsUserW`. Features adicionais:
# - `Win32_System_Pipes` — `CreatePipe` + `SetHandleInformation`
#   (read/write ends dos stdout/stderr/stdin pipes).
# - `Win32_Security_Authorization` — `SetEntriesInAclW` + `SetSecurityInfo`
#   (DACL no workdir permitindo só o SID restritivo próprio).
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_Security"] }

[dev-dependencies]
frederico-core = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
# Etapa 5+ da Fase 7 (path safety): o `set_low_integrity_label` em
# `crates/security/src/jail.rs::spawn_windows` rotula o workdir via
# `SetFileSecurityW` — exige que o workdir seja owned pelo user.
# `std::env::current_dir()` no test v1 (`tree_kill.rs`) apontava
# pra `C:\src\Frederico-IA\crates\security` que **não** é owned
# pelo user de CI (`%USERPROFILE%`), então a Etapa 5+ fez o test
# quebrar com `ERROR_ACCESS_DENIED` (5). Fix: tempdir owned pelo
# user, que sobrevive enquanto o test roda (drop no fim do test).
tempfile = "3"
tokio = { workspace = true }

# Re-expor `windows` para os integration tests (`#[cfg(windows)]`).
# O `target.'cfg(windows)'.dependencies` acima só vale para a `lib`,
# não para `tests/`. Adicione aqui as features que os testes em
# `crates/security/tests/*` precisem usar (Job Object, token, etc.).
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security_Authorization", "Win32_Security"] }
