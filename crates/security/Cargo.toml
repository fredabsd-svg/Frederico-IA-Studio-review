[package]
name = "frederico-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
# `deny` em vez de `forbid` para permitir `#![allow(unsafe_code)]`
# **apenas** no módulo `windows`, que é a única ponte com a Win32
# (DPAPI / Credential Manager). Qualquer outro `unsafe` que surja em
# outro lugar do crate quebra o build — exatamente o que queremos.
# Ver ADR-0007 §Implementação Windows.
unsafe_code = "deny"

[dependencies]
async-trait = { workspace = true }
frederico-core = { workspace = true }
frederico-storage = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
# Etapa 2 da Fase 7 (ADR-0036): `SecurityJailResolver` usa
# `tokio::process::Command` (peça 4) e `tokio::process::Child` (para
# I/O async do stdout/stderr). Feature `process` é a única
# necessária — `rt`/`rt-multi-thread` ficam para o caller do
# resolver (a casca Tauri já tem tokio runtime configurado).
tokio = { workspace = true, features = ["process"] }

# Implementação Windows do CredentialStore (DPAPI / Windows Credential
# Manager) — gateada por target. É a **única** parte do núcleo que
# depende de plataforma, conforme ADR-0003 e ADR-0007.
[target.'cfg(windows)'.dependencies]
# Etapa 2 da Fase 7 (ADR-0036) adiciona Job Objects (kill tree)
# + Restricted Token (drop 6 privilégios elevados). As features
# `Win32_System_Threading` + `Win32_System_JobObjects` + `Win32_Security`
# entram aqui, **dentro do mesmo módulo `windows`** (a única ponte
# com Win32 no núcleo, ADR-0007). Ver scripts/check-core-purity.ps1
# para a allowlist de `windows` em `crates/security/src/windows*`.
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }

[dev-dependencies]
frederico-core = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Re-expor `windows` para os integration tests (`#[cfg(windows)]`).
# O `target.'cfg(windows)'.dependencies` acima só vale para a `lib`,
# não para `tests/`. Adicione aqui as features que os testes em
# `crates/security/tests/*` precisem usar (Job Object, token, etc.).
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }
