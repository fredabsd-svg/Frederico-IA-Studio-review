[package]
name = "frederico-tool-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tool Registry, manifesto de ferramentas, validação, jail e files.read in-process (Fase 3, Etapa 2)."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
frederico-core = { workspace = true }
frederico-process-architecture = { workspace = true }
# Etapa 4 da Fase 7: `exec.python` / `exec.node` consomem
# `SecurityJailResolver` (Etapa 2) e `RuntimeRegistry` (Etapa 3).
frederico-security = { workspace = true }
frederico-runtimes = { workspace = true }
# Etapa 3 da Fase 8: as 5 ferramentas `git.*` delegam ao
# `git-engine`, que é puro e não conhece o Jail — quem entrega o
# workspace resolvido é este crate (ADR-0040 §D3).
frederico-git-engine = { workspace = true }
# Etapa 4/5 da Fase 8 (ADR-0048): as ferramentas de marco e de
# GitHub delegam aos motores; a política vive neles, e aqui fica só
# a superfície que o agente enxerga.
frederico-project-engine = { workspace = true }
frederico-github-engine = { workspace = true }
sqlx = { workspace = true }
secrecy = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
jsonschema = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# `permission_loader` (Etapa 3 Fase 6, PR 2) precisa
# resolver `~/.config/frederico/profiles/default.toml` cross-OS
# (Linux/macOS via XDG, Windows via %APPDATA%). O mesmo `directories`
# que o `model-catalog` já usa pro `~/.config/frederico/specialists.toml`.
directories = { workspace = true }
# `toml` pra parse do profile (decisão análoga ao
# `model-catalog` Etapa 3 PR 1: pra 4 chaves planas o parse
# manual seria viável, mas `permission_loader` precisa
# desserializar 18 campos com enums aninhados — `toml::from_str`
# é mais robusto).
toml = "0.8"
# `sha2` + `hex` (Etapa 5 do Phase 7, ADR-0035 D6): o `files.write`
# calcula `before_sha256` / `after_sha256` do conteúdo escrito
# e grava no `result_json` do `AuditEntry` (Passo 10 do
# `validate_tool_call`). SHA-256, não o conteúdo em si — o
# log de auditoria vaza hash, não credencial. `hex` só pra
# serializar o hash como string lowercase.
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
