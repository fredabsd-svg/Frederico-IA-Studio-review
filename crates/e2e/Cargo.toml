[package]
name = "frederico-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Testes E2E do Frederico IA Studio atravessando o caminho de produção (modelo → casca → worker → arquivo). Sem subir a casca Tauri — consome frederico_app::build_chat_orchestrator direto. Ver docs/architecture/testing-strategy.md §3 e docs/modules/e2e.md."

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
# Núcleo e composição (Etapa 5)
frederico-app = { workspace = true }
frederico-core = { workspace = true }
frederico-agent-engine = { workspace = true }
frederico-tool-registry = { workspace = true }
frederico-provider-engine = { workspace = true }
frederico-storage = { workspace = true }
frederico-security = { workspace = true }
# Etapa 4 da Fase 7: `frederico-runtimes` é dep direto
# dos E2E de exec (`e2e_exec_python_under_sandbox`,
# `e2e_approval_display`) pra construir o `RuntimeRegistry`
# no setup com `install_root` em tempdir. `frederico-tool-registry`
# já o traz transitivamente, mas listar explícito torna
# a dependência auditável.
frederico-runtimes = { workspace = true }
frederico-model-catalog = { workspace = true }
frederico-execution-engine = { workspace = true }
frederico-process-architecture = { workspace = true }
frederico-document-kits = { workspace = true }
frederico-document-engine = { workspace = true }
frederico-memory = { workspace = true }
frederico-test-support = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
# HTTP client (Etapa 6 da Fase 7 — `e2e_network_proxy.rs`).
# Já é dep transitivo via `frederico-provider-engine` (que usa),
# mas listar explícito torna auditável.
reqwest = { workspace = true }

# Utilitários
tempfile = "3"
uuid = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
# Subscriber de `tracing` para os E2E que dependem de provedor
# externo. Sem ele, um erro do provedor vira timeout mudo: o
# `MemoryExtractor` captura o erro do classificador e o registra
# via `tracing::warn!` sem propagar (regra do ADR-0012 §2), então
# o teste só observa "nada foi persistido" e não consegue dizer
# por quê. Ver `e2e_memory_real_embeddings.rs::init_tracing`.
tracing-subscriber = { workspace = true }
secrecy = { workspace = true }
# SHA-256 (usado pelo e2e_files_write_under_jail pra recalcular
# os hashes D6 esperados e asserir que `after_sha256` do output
# bate com o hash real do conteúdo escrito em disco).
sha2 = "0.10"
hex = "0.4"

# Python embedding — usado só pelo teste e2e_docs_generate_with_real_worker
# (#[ignore]). Roda `python.exe` do workers/document-worker/runtime/ via
# std::process::Command pra validar que o `DocumentWorkerLauncher` produz
# um .docx real.
