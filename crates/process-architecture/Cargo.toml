[package]
name = "frederico-process-architecture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Manager de workers sidecar + IPC via named pipes + handshake (Fase 5, Etapa 2A: fundação do process-architecture; Etapa 2B: transporte real sobre Tokio + ADR-0017)."

[lints.rust]
# `deny` em vez de `forbid` para permitir `#![allow(unsafe_code)]`
# no módulo `windows_pipes` (Etapa 2B) **ou** em outro módulo
# que precise da `windows` crate (Etapa 3+ se virar necessário,
# ex.: security descriptor customizado). Por enquanto o módulo
# `windows_pipes.rs` não usa `unsafe` — a Tokio envelopa o
# `HANDLE` Win32 de forma segura (ADR-0017 §Decisão 5). Mesma
# regra do `frederico-security`, ADR-0007 §Implementação Windows.
unsafe_code = "deny"

# Binário `worker_stub` — stub do sidecar usado pelos tests
# E2E do `spawn_external` em `tests/external_worker.rs`.
# Compilado via `cargo build` e invocado com
# `env!("CARGO_BIN_EXE_worker_stub")` no test setup. O stub
# implementa o protocolo completo do `process-architecture`
# sobre `tokio::net::windows::named_pipe` (mesma stack do
# manager). Substitui o stub PowerShell (`tests/stubs/worker-stub.ps1`)
# que era flaky no Windows Server 2022 runner do GitHub
# Actions (cold-start > 30s; PR #11). O PowerShell stub
# continua em `tests/stubs/` como referência.
[[bin]]
name = "worker_stub"
path = "src/bin/worker_stub.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util", "process"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# A Etapa 2A é o **protocolo** (envelope, manifest, manager) + um
# fake in-process pra testes. A Etapa 2B adiciona o transporte
# real `WindowsPipeReader`/`Writer` via `tokio::net::windows::named_pipe`
# (gateado em `#[cfg(windows)]` no módulo `windows_pipes.rs`) — sem
# `crate windows`, sem `unsafe` no nosso código (ADR-0017).
#
# **Etapa 2B fechada em 2026-07-29 (PRs #9 + #10):**
# 2 integration tests com named pipes reais (saíram do `#[ignore]`
# na continuação); 1 ADR novo (0017). Suíte do crate: 32/32
# verde (12 unit + 10 fake_worker integration + 2 windows_pipes_smoke
# integration + 5 external unit + 3 external_worker integration).
#
# **Etapa 2B continuação (este commit):**
# `WorkerManager::spawn_external` em `src/external.rs` (gateado
# `#[cfg(windows)]`) — abre o processo via `tokio::process::Command`,
# lê `READY <name>` do stdout (10s timeout), faz `connect_pipe_client`,
# `ready()` no client, e segue o handshake `worker.hello`/`app.ack`
# igual ao `spawn_in_process`. Stderr é pumpado pra `tracing::warn!`
# em task separada. `WorkerManager` ganhou campo `child: Option<Child>`
# e o `shutdown` agora faz `child.wait()` com timeout 5s (kill+wait
# se o worker não respondeu ao `app.shutdown`). Stubs e tests em
# `tests/stubs/worker-stub.ps1` + `tests/external_worker.rs` (3
# tests E2E). `document-worker` Python (em `workers/document-worker/`)
# e o `bootstrap.ps1` entregam juntos no mesmo PR — o stub PowerShell
# prova o `spawn_external` end-to-end sem depender de Python no CI.

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
serde_json = { workspace = true }
frederico-test-support = { workspace = true }
