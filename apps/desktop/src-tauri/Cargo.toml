[package]
name = "frederico-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "frederico-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
frederico-core = { workspace = true }
frederico-storage = { workspace = true }
frederico-diagnostics = { workspace = true }
frederico-security = { workspace = true }
# Etapa 4 da Fase 7: `frederico-runtimes` é construído
# diretamente pela casca (não via `frederico-app`) pra
# permitir spawn do `bootstrap_all` em background task
# antes da construção das tools. Mantido como dep direto
# pra não inflar a API pública do `frederico-app`.
frederico-runtimes = { workspace = true }
frederico-provider-engine = { workspace = true }
frederico-model-catalog = { workspace = true }
frederico-shared-contracts = { workspace = true }
frederico-execution-engine = { workspace = true }
frederico-tool-registry = { workspace = true }
frederico-memory = { workspace = true }
frederico-app = { workspace = true }
frederico-document-kits = { workspace = true }
frederico-process-architecture = { workspace = true }
tokio = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
