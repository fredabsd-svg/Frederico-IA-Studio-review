name: CI Nightly (Tesseract OCR)

# CI noturno isolado (Fase 5, Etapa 2B+Y, ADR-0019 §Decisao 4).
# Por que separado do `ci.yml`:
#   1. **Isolar flakiness do Tesseract.** O bootstrap instala
#      Tesseract 5.4.0 do UB-Mannheim (instalador NSIS com silent
#      install /S /D=path). Edge cases de PATH, locale, install
#      podem produzir testes flaky. O gate principal (PR) nao
#      depende disso - se o noturno quebrar, o main fica verde
#      e o problema tem tempo de ser investigado com calma.
#   2. **Stress test.** Roda o mesmo `verify-external.ps1` (todos
#      os 11 testes do `external_doc_worker.rs`, incluindo os 2
#      de OCR que dependem de Tesseract) mais vezes em
#      backgrounds diferentes, detectando race conditions.
#   3. **Bump de Tesseract ou tessdata.** Quando o mantenedor
#      cortar nova versao, o noturno quebra primeiro (antes do
#      gate) - tempo de revisar o bump sem bloquear PRs.
#
# O CI noturno NAO bloqueia merge. So roda o schedule + manual
# (`workflow_dispatch`). O gate continua sendo `ci.yml`.

on:
  schedule:
    # Cron em UTC. 04:00 UTC = 01:00 BRT (madrugada Brasil) =
    # 21:00 PDT (noite EUA anterior) = pouco uso do GitHub.
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify-nightly:
    name: verify-nightly (Windows)
    # windows-latest roda como Admin - o `silent install` do
    # instalador NSIS do Tesseract funciona sem UAC prompt.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O guard de impacto documental diffa contra a base do PR.
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Cache do `runtime/` do `document-worker` (Fase 5, Etapa 2B+Y).
      # Invalida quando `pyproject.toml` ou `bootstrap.ps1` mudam.
      - name: Cache document-worker runtime
        uses: actions/cache@v4
        with:
          path: workers/document-worker/runtime
          key: document-worker-runtime-${{ hashFiles('workers/document-worker/pyproject.toml', 'workers/document-worker/bootstrap.ps1') }}

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::await_holding_lock

      # **O noturno roda a suíte COMPLETA de testes OCR** (gate
      # principal tb roda, mas em PR; noturno roda em contexto
      # cron + manual). Inclui os 2 testes que dependem de
      # Tesseract instalado. Falha aqui NAO bloqueia merge
      # (gate e separado).
      - name: Tests
        run: cargo test --workspace

      # E2E do `document-worker` Python (Fase 5, Etapa 2B+Y). O
      # `verify-external.ps1` faz bootstrap idempotente + roda
      # 11 testes (9 sem Tesseract + 2 com Tesseract). Os 2
      # com Tesseract passam aqui porque o runner e admin.
      - name: E2E document-worker handlers (OCR)
        shell: pwsh
        run: ./scripts/verify-external.ps1

      # E2E de memória real (Fase de Ligação, Etapa 3,
      # 2026-08-04). Classificador LLM + embedding reais via
      # OpenRouter. **Só roda no noturno** porque o CI de PR
      # nao pode depender de provedor externo (latencia, cota,
      # custo em dinheiro a cada PR) — mesmo principio do
      # ADR-0008 (provedor simulado em CI de PR) e do
      # ADR-0019 (Tesseract no noturno). O
      # `e2e_memory_pipeline_end_to_end` (sempre roda no CI
      # de PR, com provider falso) cobre o pipeline; este
      # aqui cobre o adaptador real contra a API real.
      # Requer `OPENROUTER_API_KEY` em runtime — o helper
      # `memory_real_providers_or_fail` faz panic com mensagem
      # clara apontando pra env se faltar. Falhar (em vez de
      # pular) e' deliberado: teste de cobertura que pula por
      # ausencia do que deveria testar e' fail-open com outra
      # roupa. Ver ADR-0026 D2.
      #
      # ATENCAO (Etapa 2 da Fase 8): este passo falha desde
      # 2026-08-05 porque o secret `OPENROUTER_API_KEY` **nao
      # existe** no repositorio. O noturno rodou verde em
      # 2026-08-03 e 2026-08-04; quebrou no `d41b182` (PR #27),
      # que acrescentou este passo. Conserto: `gh secret set
      # OPENROUTER_API_KEY` — acao do mantenedor, nao de codigo.
      - name: E2E memory real (OpenRouter + gpt-4o-mini + text-embedding-3-small)
        shell: pwsh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: cargo test -p frederico-e2e --test e2e_memory_real_embeddings -- --include-ignored

      # `if: always()` porque um guard nao pode ser mascarado por
      # um passo que depende de provedor externo. Sem isso, este
      # guard aparece como `skipped` toda vez que o passo acima
      # falha — foi o que aconteceu por 13 noites seguidas: o
      # `check-core-purity` do noturno **nunca rodou** desde
      # 2026-08-05, e ninguem viu, porque o job ja estava
      # vermelho por outro motivo.
      #
      # Um passo vermelho continua deixando o job vermelho. O
      # `always()` muda o que **e' medido**, nao o que e'
      # reportado.
      - name: Core purity guard (ADR-0003)
        if: always()
        shell: pwsh
        run: ./scripts/check-core-purity.ps1
