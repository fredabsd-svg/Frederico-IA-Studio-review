name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: verify (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O guard de impacto documental diffa contra a base do PR.
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # `-D clippy::await_holding_lock` é a trava que o
        # ADR-0015 + ADR-0016 instituíram: impede que
        # `MutexGuard` (ou qualquer guard de lock do `std::sync`
        # ou `tokio::sync`) seja segurado através de um `.await`
        # — classe de bug que produziu o deadlock do
        # `WorkerManager::invoke` na Etapa 2A da Fase 5. Mesmo
        # espírito do `check-core-purity.ps1` (ADR-0003) e do
        # `check-docs.mjs` (REGRAS §1.10): a máquina coíbe a
        # classe, em vez de depender de revisão manual.
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::await_holding_lock

      - name: Tests
        run: cargo test --workspace

      - name: Core purity guard (ADR-0003)
        shell: pwsh
        run: ./scripts/check-core-purity.ps1

      # REGRAS §1.4 + §1.10 + §1.13: cabeçalho e carimbo dos specs, trava do
      # caminho inverso, documento por módulo e links internos.
      - name: Docs guard (REGRAS §1.10)
        run: node scripts/check-docs.mjs

      # REGRAS §1.10, quarto item + válvula de escape do §1.3.
      - name: Doc-impact guard (REGRAS §1.10)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-doc-impact.mjs
