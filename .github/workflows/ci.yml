name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: verify (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O guard de impacto documental diffa contra a base do PR.
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Cache do `runtime/` do `document-worker` (Fase 5, Etapa 2B+X).
      # Invalida quando `pyproject.toml` ou `bootstrap.ps1` mudam -
      # bump de dep ou do script refaz a instalacao (download ~120 MB
      # no primeiro run, ~0 nos subsequentes).
      - name: Cache document-worker runtime
        uses: actions/cache@v4
        with:
          path: workers/document-worker/runtime
          key: document-worker-runtime-${{ hashFiles('workers/document-worker/pyproject.toml', 'workers/document-worker/bootstrap.ps1') }}

      # E2E do `document-worker` Python (Fase 5, Etapa 2B+X/Y). O
      # `verify-external.ps1` faz (1) bootstrap idempotente e
      # (2) roda os 11 testes E2E em
      # `crates/process-architecture/tests/external_doc_worker.rs`
      # (NAO `#[ignore]` - rodam em todo PR, nao sao pulados).
      # Cold-start Python + libs + Tesseract + tessdata ~3-5min;
      # com cache ~1s. **RODA ANTES do `Tests`** porque o
      # `cargo test --workspace` do step `Tests` re-roda os mesmos
      # 11 E2E (estao em `tests/external_doc_worker.rs`, sao
      # integration tests) e precisa do runtime ja instalado -
      # se rodar sem bootstrap, todos os 11 E2E panicam com
      # `python.exe nao encontrado` (CI run 30574758324, 2026-07-30).
      # Falha aqui bloqueia merge (REGRAS 2.3 porta 1: CI vermelho
      # nao entra).
      - name: E2E document-worker handlers
        shell: pwsh
        run: ./scripts/verify-external.ps1

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # `-D clippy::await_holding_lock` é a trava que o
        # ADR-0015 + ADR-0016 instituíram: impede que
        # `MutexGuard` (ou qualquer guard de lock do `std::sync`
        # ou `tokio::sync`) seja segurado através de um `.await`
        # — classe de bug que produziu o deadlock do
        # `WorkerManager::invoke` na Etapa 2A da Fase 5. Mesmo
        # espírito do `check-core-purity.ps1` (ADR-0003) e do
        # `check-docs.mjs` (REGRAS §1.10): a máquina coíbe a
        # classe, em vez de depender de revisão manual.
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::await_holding_lock

      # Os 11 E2E do `external_doc_worker.rs` re-rodam aqui
      # (cargo roda todos os integration tests). Sao idempotentes
      # e encontram o runtime ja instalado pelo step anterior.
      - name: Tests
        run: cargo test --workspace

      - name: Core purity guard (ADR-0003)
        shell: pwsh
        run: ./scripts/check-core-purity.ps1

      # REGRAS §1.4 + §1.10 + §1.13: cabeçalho e carimbo dos specs, trava do
      # caminho inverso, documento por módulo e links internos.
      - name: Docs guard (REGRAS §1.10)
        run: node scripts/check-docs.mjs

      # REGRAS §1.10, quarto item + válvula de escape do §1.3.
      - name: Doc-impact guard (REGRAS §1.10)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-doc-impact.mjs
