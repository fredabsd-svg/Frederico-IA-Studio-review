[project]
name = "frederico-document-worker"
version = "0.2.0"
description = "Document worker sidecar do Frederico IA Studio (gera DOCX, XLSX, PDF e le os tres formatos - Fase 5, Etapa 2B+X)"
requires-python = ">=3.11"
# Dependencias centradas (todas instaladas pelo `bootstrap.ps1` em
# `runtime/`, nao via pip do sistema):
#
#   pywin32       - named pipes do Windows via Python
#                   (CreateNamedPipe, ConnectNamedPipe, ReadFile, WriteFile)
#   python-docx   - handler `docx.write` / `docx.read`
#   openpyxl      - handler `xlsx.write` / `xlsx.read`
#   reportlab     - handler `pdf.write` (com fontes Source Sans 3 / Source
#                   Serif 4 embutidas - "Tinta e Latao" / ADR-0018)
#   pdfplumber    - handler `pdf.read` (extracao de texto + deteccao de
#                   paginas escaneadas)
#
# NOTA: `pytesseract` (OCR) e `pymupdf`/`matplotlib` (charts, Kpis do
# DocumentSpec) NAO estao nesta versao 0.2.0. OCR entra na Etapa 2B+Y
# (Tesseract + por/eng traineddata + handler `ocr.run` + fallback OCR no
# `pdf.read`); `pymupdf` e `matplotlib` entram com a integracao do
# DocumentSpec (Etapa 3 - os handlers da v0.2.0 sao primitivas de baixo
# nivel, o kit WordPro/ExcelPro/PdfPro renderiza o spec, ver ADR-0018).
dependencies = [
    "pywin32>=306",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "pdfplumber>=0.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["document-worker"]
