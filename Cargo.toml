[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/diagnostics",
    "crates/security",
    "packages/shared-contracts",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/frederico-ia-studio/frederico-ia-studio"
authors = ["Frederico IA Studio contributors"]

[workspace.dependencies]
# Núcleo
frederico-core = { path = "crates/core" }
frederico-storage = { path = "crates/storage" }
frederico-diagnostics = { path = "crates/diagnostics" }
frederico-security = { path = "crates/security" }
frederico-shared-contracts = { path = "packages/shared-contracts" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
async-trait = "0.1"

# Serialização
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identificadores e tempo
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Erros
thiserror = "1"
anyhow = "1"

# Banco de dados
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono", "uuid"] }

# Logs
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }

# Utilitários
directories = "5"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
