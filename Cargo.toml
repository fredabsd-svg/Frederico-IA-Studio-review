[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/diagnostics",
    "crates/security",
    "crates/runtimes",
    "crates/provider-engine",
    "crates/model-catalog",
    "crates/agent-engine",
    "crates/tool-registry",
    "crates/execution-engine",
    "crates/memory",
    "crates/git-engine",
    "crates/document-engine",
    "crates/document-kits",
    "crates/process-architecture",
    "crates/test-support",
    "crates/app",
    "crates/e2e",
    "packages/shared-contracts",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-only"
repository = "https://github.com/fredabsd-svg/Frederico-IA-Studio-review"
authors = ["Frederico IA Studio contributors"]

[workspace.dependencies]
# Núcleo
frederico-core = { path = "crates/core" }
frederico-storage = { path = "crates/storage" }
frederico-diagnostics = { path = "crates/diagnostics" }
frederico-security = { path = "crates/security" }
frederico-runtimes = { path = "crates/runtimes" }
frederico-provider-engine = { path = "crates/provider-engine" }
frederico-model-catalog = { path = "crates/model-catalog" }
frederico-agent-engine = { path = "crates/agent-engine" }
frederico-tool-registry = { path = "crates/tool-registry" }
frederico-execution-engine = { path = "crates/execution-engine" }
frederico-memory = { path = "crates/memory" }
frederico-git-engine = { path = "crates/git-engine" }
frederico-document-engine = { path = "crates/document-engine" }
frederico-document-kits = { path = "crates/document-kits" }
frederico-process-architecture = { path = "crates/process-architecture" }
frederico-test-support = { path = "crates/test-support" }
frederico-app = { path = "crates/app" }
frederico-shared-contracts = { path = "packages/shared-contracts" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"

# Serialização
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identificadores e tempo
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Erros
thiserror = "1"
anyhow = "1"

# Banco de dados
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono", "uuid"] }

# Logs
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }

# Utilitários
directories = "5"
once_cell = "1"
secrecy = { version = "0.10", features = ["serde"] }

# HTTP e SSE (provider-engine)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
eventsource-stream = "0.2"
http = "1"
bytes = "1"

# Validação de JSON Schema (tool-registry, document-engine).
# `draft202012` é necessário porque o `schemars` 0.8 (que o
# `document-engine` usa para gerar o schema do `DocumentSpec`)
# produz JSON Schema 2020-12.
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
# Geração de JSON Schema a partir de tipos Rust (document-engine — Etapa 1 da Fase 5).
# `schemars` 0.8 casa com `jsonschema` 0.18 (mesma major do tool-registry).
# `derive` é a feature default e habilita a macro `#[derive(JsonSchema)]`.
schemars = { version = "0.8" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
